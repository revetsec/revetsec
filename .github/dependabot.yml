version: 2
updates:
  # Revetsec core has zero runtime dependencies; these entries watch build/test tooling only.
  # Every entry waits 7 days after a release before proposing it (cooldown), so a compromised or
  # yanked release is less likely to reach a PR.
  # Include the standalone tooling and examples so shared versions move in one PR.
  # Java contract-fixture POMs under src/test/resources are intentional test inputs.
  - package-ecosystem: maven
    directories:
      - "/"
      - "/fuzz"
      - "/differential"
      - "/conformance"
      - "/verification/packaged-consumer"
      - "/verification/issuer-store"
      - "/examples/barebones-oidc"
      - "/examples/playground"
      - "/examples/postgresql-pending-store"
      - "/examples/rsa-oidc"
      - "/examples/self-issued"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

    groups:
      build-and-test-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Revetsec artifacts are built from the source/pushed commits under test, not Central.
      - dependency-name: "com.revetsec:*"
      # The examples deliberately use the Soklet 4.0 baseline. Move its API floor by hand.
      - dependency-name: "com.soklet:soklet"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The comparator and adapter fixtures deliberately compile against Servlet 6.1.
      - dependency-name: "jakarta.servlet:jakarta.servlet-api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The scripted IdP's hash-pinned Python wheels (plan §14.10).
  - package-ecosystem: pip
    directory: "/interop/scripted-idp"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      scripted-idp-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # lxml and xmlsec move only together, in a manual PR: lxml must match the libxml2 bundled in the
      # xmlsec wheel (plan §14.10, §16).
      - dependency-name: "lxml"
      - dependency-name: "xmlsec"

  # The scripted IdP's digest-pinned base image.
  - package-ecosystem: docker
    directory: "/interop/scripted-idp"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The wheels are cp313, so only patch and digest updates of the python image are taken.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ClusterFuzzLite builder image (digest-pinned base-builder-jvm:v1; the Maven version and SHA-512 ARGs
  # move by hand). Move the clusterfuzzlite-build-fuzzers and -run-fuzzers digests in the docker://
  # steps of .github/workflows/cflite_*.yml by hand in the same PR; do not rely on Dependabot for them.
  - package-ecosystem: docker
    directory: "/.clusterfuzzlite"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # node-oidc-provider test OP (plan §14.8): npm lockfile and digest-pinned node base image.
  - package-ecosystem: npm
    directory: "/interop/node-oidc-provider"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      node-provider:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/interop/node-oidc-provider"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The test OP stays on a Node LTS line; major moves are deliberate, by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
