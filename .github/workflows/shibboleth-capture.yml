name: Shibboleth SAML capture

# Run manually during RC-2 after the source and fixture changes are pushed.
# The job refreshes real IdP evidence in its workspace; it never commits it.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: Shibboleth 5.2.3 GCM and CBC
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build the current Revetsec classes and tests
        run: mvn -B -ntp -Dmaven.javadoc.skip=true -DskipTests test-compile

      - name: Pull the pinned Shibboleth IdP image
        run: docker pull i2incommon/shib-idp:5.2.3_20260824_rocky10_multiarch

      - name: Capture both real IdP responses
        run: python3 interop/shibboleth/capture.py --output "${RUNNER_TEMP}/shibboleth-capture"

      - name: Replay new captures through the SP
        run: mvn -B -ntp -Dmaven.javadoc.skip=true -Dtest=ShibbolethCapturedResponseTests "-Drevetsec.shibboleth.fixtures=${RUNNER_TEMP}/shibboleth-capture" test

      - name: Require all hosted replay cases and zero skips
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse('target/surefire-reports/TEST-com.revetsec.saml.ShibbolethCapturedResponseTests.xml').getroot()
          expected = {
              'realShibbolethGcmResponseAuthenticatesOnlyOnce',
              'realShibbolethGcmAcceptsEightConfiguredRolloverKeys',
              'realShibbolethCbcResponseRequiresPerIdpOptIn',
              'capturedEncryptedResponsesRejectEnvelopeAttacksBeforeAcceptingOriginal',
              'capturedSpMetadataMatchesGeneratedOutputAndDocumentedCbcVariant',
              'capturedRedirectRequestsCarryValidSpBindingSignatures',
          }
          actual = {case.get('name') for case in report.findall('testcase')}
          failures = sum(int(report.get(key, '0')) for key in ('failures', 'errors', 'skipped'))
          if actual != expected or failures:
              sys.exit(f'Shibboleth replay mismatch: missing={sorted(expected - actual)}, '
                       f'unexpected={sorted(actual - expected)}, failures/errors/skips={failures}')
          print(f'Shibboleth hosted replay required: {len(expected)} methods; zero skips')
          PY

      - name: Upload captured evidence and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shibboleth-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shibboleth-capture
            target/surefire-reports/TEST-com.revetsec.saml.ShibbolethCapturedResponseTests.xml
          if-no-files-found: warn
          retention-days: 30
