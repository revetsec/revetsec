name: SCIM independent interoperability

# PR tester qualification plus ongoing nightly outbound-client coverage.
# Nightly results are advisory; there is no minimum-duration release gate.
on:
  pull_request:
    paths:
      - 'src/main/java/com/revetsec/scim/**'
      - 'src/main/java/com/revetsec/internal/json/**'
      - 'src/main/java/com/revetsec/internal/encoding/**'
      - 'pom.xml'
      - 'examples/**'
      - 'interop/scim/**'
      - '.github/workflows/scim-interop.yml'
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: SCIM independent qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current core and examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Soklet adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec-soklet
          ref: 7f99a80a7971e47fb763d69cca36c74f4bc5e9b1
          path: .scim-inputs/adapter
          persist-credentials: false

      - name: Check out pinned Soklet framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soklet/soklet
          ref: 61d02245c745cedf8452a1fc0a13be96f9414a9b
          path: .scim-inputs/framework
          persist-credentials: false

      - name: Verify the qualified Soklet SCIM source
        run: |
          if ! sha256sum --check interop/scim/adapter-source.sha256; then
            echo '::error::The pinned adapter source does not match the reviewed SCIM helper. Update the exact pushed adapter revision and source checksum together.'
            exit 1
          fi

      - name: Download checksum-pinned Corretto 21.0.11 for Soklet
        run: >-
          bash .github/scripts/download-pinned-corretto21-linux-x64.sh
          "$RUNNER_TEMP/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz"

      - name: Set up Corretto 21.0.11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jdkfile
          java-version: '21.0.11'
          jdk-file: ${{ runner.temp }}/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz
          cache: maven

      - name: Build and verify pinned framework
        working-directory: .scim-inputs/framework
        run: |
          mvn -B -ntp -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dgpg.skip=true clean install
          echo "56e37d0e8ef781822de1618595f43366df00bb29e7b486cdc5901623b83845a9  target/soklet-4.0.0.jar" | sha256sum --check

      - name: Build current SCIM core and pinned adapter
        run: |
          mvn -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true clean install
          mvn -B -ntp -f .scim-inputs/adapter/pom.xml -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true clean install

      - name: Compile and test actual provisioning routes
        run: mvn -B -ntp -f examples/playground/pom.xml clean verify

      - name: Install checksum-pinned independent tester
        run: |
          python3 -m venv "${RUNNER_TEMP}/scim-tester"
          "${RUNNER_TEMP}/scim-tester/bin/python" -m pip install --disable-pip-version-check --require-hashes -r interop/scim/requirements.txt

      - name: Verify runtime baseline and scheduled evidence accounting
        run: python3 -m unittest discover -s interop/scim -p 'test_*.py'

      - name: Run independent tester and scheduled outbound client qualification
        run: >-
          python3 interop/scim/run.py
          --classes examples/playground/target/classes
          --class-path-file examples/playground/target/runtime-classpath.txt
          --python "${RUNNER_TEMP}/scim-tester/bin/python"
          --mode ${{ github.event_name == 'pull_request' && 'tester' || 'both' }}
          --output "${RUNNER_TEMP}/scim-qualification"

      - name: Upload exact qualification outcome evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scim-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scim-qualification/
            examples/playground/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90
