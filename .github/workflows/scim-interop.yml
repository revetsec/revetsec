name: SCIM independent interoperability

# PR tester qualification plus ongoing nightly outbound-client coverage.
# Nightly results are advisory; there is no minimum-duration release gate.
on:
  pull_request:
    paths:
      - 'src/main/java/com/revetsec/scim/**'
      - 'src/main/java/com/revetsec/internal/json/**'
      - 'src/main/java/com/revetsec/internal/encoding/**'
      - 'pom.xml'
      - 'examples/**'
      - 'interop/scim/**'
      - '.github/workflows/scim-interop.yml'
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: SCIM independent qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current core and examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Soklet adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec-soklet
          ref: 40e52aa703c02b1ad49c04a256c9989212a94759
          path: .scim-inputs/adapter
          persist-credentials: false

      - name: Verify the qualified Soklet SCIM source
        run: |
          if ! sha256sum --check interop/scim/adapter-source.sha256; then
            echo '::error::The pinned adapter source does not match the reviewed SCIM helper. Update the exact pushed adapter revision and source checksum together.'
            exit 1
          fi

      - name: Set up Corretto 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Resolve checksum-bound Soklet 4.0.0 from Maven Central
        run: |
          artifact="$HOME/.m2/repository/com/soklet/soklet/4.0.0"
          mvn -B -ntp dependency:get -Dartifact=com.soklet:soklet:4.0.0 -Dtransitive=false \
            -DremoteRepositories=central::default::https://repo.maven.apache.org/maven2
          echo "9dd10e8a1d7cad0824349d54220bf81d4933da987851ee7423a8f69703b2c1ce  $artifact/soklet-4.0.0.jar" | sha256sum --check --strict
          echo "496cdb065ffc2db4b17a6c1ced6262d261a752883e689fdfc72c52143b99b8ba  $artifact/soklet-4.0.0.pom" | sha256sum --check --strict

      - name: Build current SCIM core and pinned adapter
        run: |
          mvn -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true clean install
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from verification.examples import adapter_compatibility

          root = Path.cwd()
          adapter = root / ".scim-inputs/adapter"
          revision = json.loads((root / "examples/pins.json").read_text())["adapter"]["revision"]
          compatibility = adapter_compatibility.prepare_adapter(root, adapter, revision)
          receipt = Path(os.environ["RUNNER_TEMP"]) / "ADAPTER-COMPATIBILITY.json"
          receipt.write_text(json.dumps(compatibility, indent=2) + "\n")
          try:
              subprocess.run(["mvn", "-B", "-ntp", "-f", str(adapter / "pom.xml"),
                              "-Dmaven.javadoc.skip=true", "-Dgpg.skip=true", "clean", "install"],
                             check=True)
          finally:
              adapter_compatibility.assert_adapter_unchanged(adapter, compatibility)
              receipt.write_text(json.dumps(compatibility, indent=2) + "\n")
          adapter_compatibility.record_test_results(adapter, compatibility)
          receipt.write_text(json.dumps(compatibility, indent=2) + "\n")
          PY

      - name: Compile and test actual provisioning routes
        run: mvn -B -ntp -f examples/playground/pom.xml clean verify

      - name: Install checksum-pinned independent tester
        run: |
          python3 -m venv "${RUNNER_TEMP}/scim-tester"
          "${RUNNER_TEMP}/scim-tester/bin/python" -m pip install --disable-pip-version-check --require-hashes -r interop/scim/requirements.txt

      - name: Verify runtime baseline and scheduled evidence accounting
        run: python3 -m unittest discover -s interop/scim -p 'test_*.py'

      - name: Run independent tester and scheduled outbound client qualification
        run: >-
          python3 interop/scim/run.py
          --classes examples/playground/target/classes
          --class-path-file examples/playground/target/runtime-classpath.txt
          --python "${RUNNER_TEMP}/scim-tester/bin/python"
          --mode ${{ github.event_name == 'pull_request' && 'tester' || 'both' }}
          --output "${RUNNER_TEMP}/scim-qualification"

      - name: Upload exact qualification outcome evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scim-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scim-qualification/
            ${{ runner.temp }}/ADAPTER-COMPATIBILITY.json
            .scim-inputs/adapter/target/surefire-reports/
            examples/playground/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90
