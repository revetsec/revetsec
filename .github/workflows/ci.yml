name: CI

# Active plan §10.3 gates. Jobs still awaiting a later milestone are listed at the end as
# commented stubs, each naming the milestone it starts in.
#
# Every action is pinned to a full commit SHA (the trailing comment is the tag it was resolved from with
# `git ls-remote`, peeled for annotated tags). Dependabot's github-actions entry keeps the pins current.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  schedule:
    # Nightly: the advisory alternative-JDK and EA legs, a cache-free scripted-IdP image rebuild that
    # catches pin rot (a vanished digest or wheel), and the gating jobs again as a drift signal.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded push and PR runs on the same ref. Never cancel a nightly or manual run.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'change' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash gives `-eo pipefail` on every run step.
    shell: bash

jobs:
  # Gating. Tier 0 only: contract tests (PublicApiContractTests, PackageDependencyTests, SourcePolicyTests,
  # ContractMetaTests) and ClaimsLintTests all run inside `verify`, so the plan's `claims-lint` job is
  # covered here. Javadoc is built only by the `javadoc` job, from its pinned JDK; every other job passes
  # -Dmaven.javadoc.skip=true.
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Do not cancel the other JDKs when one fails; every JDK's result is useful.
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25', '27']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto ${{ matrix.jdk }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-jdk-${{ matrix.jdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  # Gating. Case mapping and number formatting under Turkish and Arabic default locales.
  locale:
    name: Locale (${{ matrix.locale.tag }}, JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale:
          - { tag: tr-TR, language: tr, country: TR }
          - { tag: ar-EG, language: ar, country: EG }
    env:
      # JAVA_TOOL_OPTIONS reaches Surefire's forked test JVM at startup; a Maven user property alone does not.
      JAVA_TOOL_OPTIONS: -Duser.language=${{ matrix.locale.language }} -Duser.country=${{ matrix.locale.country }}
      # For the canary test: when set, it asserts the forked test JVM's default locale has this tag.
      REVETSEC_EXPECTED_LOCALE: ${{ matrix.locale.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Assert the JVM picks up the locale
        env:
          EXPECTED_LANGUAGE: ${{ matrix.locale.language }}
          EXPECTED_COUNTRY: ${{ matrix.locale.country }}
        run: |
          settings=$(java -XshowSettings:properties -version 2>&1)
          grep -Eq "^[[:space:]]+user\.language = ${EXPECTED_LANGUAGE}\$" <<<"$settings" || {
            echo "::error::JVM default language is not ${EXPECTED_LANGUAGE}"; exit 1; }
          grep -Eq "^[[:space:]]+user\.country = ${EXPECTED_COUNTRY}\$" <<<"$settings" || {
            echo "::error::JVM default country is not ${EXPECTED_COUNTRY}"; exit 1; }
          echo "JVM default locale: ${EXPECTED_LANGUAGE}-${EXPECTED_COUNTRY}"

      - name: Verify under ${{ matrix.locale.tag }}
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

  # Gating. Error Prone + NullAway need JDK 21; the release target stays 17. Profile from the pom.
  static-analysis:
    name: Static Analysis (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Error Prone + NullAway
        run: mvn -B -ntp -Pstatic-analysis -Dmaven.javadoc.skip=true verify

  # Gating. SpotBugs + FindSecBugs, bound to `verify` by the pom's spotbugs profile.
  spotbugs:
    name: SpotBugs (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: SpotBugs + FindSecBugs
        run: mvn -B -ntp -Pspotbugs -Dmaven.javadoc.skip=true verify

  # Gating (INV-L1). Installs core into an isolated local repository, then checks the installed POM
  # (zero compile/runtime/system dependencies), the JAR's contents and Automatic-Module-Name, what a Maven
  # consumer and a Gradle consumer resolve from that repository (exactly the Revetsec JAR, with no
  # dependency of its own), that both consumers compile warning-free and run calls to the public API
  # without the provided-scope annotation JARs, and the jdeps module list. The oldest and newest supported
  # JDKs each build, consume and analyze the JAR, and run Gradle.
  packaged-consumer:
    name: Packaged Consumer (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '27']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Maven cache: the isolated repository must hold only what this job resolves and installs.
      - name: Set up Corretto ${{ matrix.jdk }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}

      - name: Self-test verification scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s verification -p 'test_*.py'
          python3 -m unittest discover -s verification/packaged-consumer -p 'test_*.py'

      # The Gradle distribution is pinned by SHA-256 in verify-packaged-consumer.py (GRADLE_VERSION and
      # GRADLE_DISTRIBUTION_SHA256), which checks the archive before extracting anything from it. Dependabot
      # does not update this pin: move the URL here, the constants there, CONTRIBUTING.md and
      # verification/README.md together (test_verify_packaged_consumer.py fails while they disagree).
      - name: Download the pinned Gradle distribution
        run: >-
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3
          --output "${RUNNER_TEMP}/gradle-9.8.0-bin.zip"
          https://services.gradle.org/distributions/gradle-9.8.0-bin.zip

      - name: Install core into an isolated local repository
        run: >-
          mvn -B -ntp -Dmaven.repo.local="${RUNNER_TEMP}/consumer-repository"
          -Dmaven.javadoc.skip=true -DskipTests clean install

      - name: Verify installed POM, JAR, Maven and Gradle consumers, and jdeps module list
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 verification/packaged-consumer/verify-packaged-consumer.py
          --repository "${RUNNER_TEMP}/consumer-repository"
          --java-home "${JAVA_HOME}"
          --gradle-distribution "${RUNNER_TEMP}/gradle-9.8.0-bin.zip"
          --output "${RUNNER_TEMP}/packaged-consumer-result"

      - name: Upload packaged-consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-consumer-jdk-${{ matrix.jdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-consumer-result
          if-no-files-found: warn
          retention-days: 30

  # Gating on replay: the checked-in seed corpus runs in Jazzer's regression mode (plan §14.5).
  # ClusterFuzzLite's PR fuzzing, batch fuzzing and corpus pruning live in cflite_pr.yml,
  # cflite_batch.yml and cflite_cron.yml.
  fuzz-regression:
    name: Fuzz Corpus Replay (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Replay fuzz corpus
        run: mvn -B -ntp -f fuzz/pom.xml verify

  # Decides whether the scripted-IdP image must be rebuilt on this push or PR.
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scripted-idp: ${{ steps.scripted-idp.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect scripted-IdP changes
        id: scripted-idp
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Nightly and manual runs always build. A push or PR builds when the image's inputs or this
          # workflow changed. If the base commit cannot be resolved, it builds: fail toward running.
          changed=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" HEAD -- interop/scripted-idp .github/workflows/ci.yml; then
            changed=false
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Scripted-IdP image inputs changed (or always-build event): ${changed}"

  # Gating from M0 (plan §10.3, §14.10). Builds the scripted-IdP image on x86-64 and arm64 and runs its
  # selftest, so a broken pin is caught before M7. The image is loaded into the runner's Docker daemon
  # only: it is never pushed to any registry (pushing would be publication, plan §14.10).
  scripted-idp-image:
    name: Scripted IdP Image (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.scripted-idp == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      # A local tag only; there is no registry prefix and nothing pushes it.
      SCRIPTED_IDP_IMAGE: revetsec-scripted-idp:ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the scripted-IdP build context
        run: |
          test -f interop/scripted-idp/Dockerfile || {
            echo "::error::interop/scripted-idp/Dockerfile is missing"; exit 1; }

      # The docker-container builder runs BuildKit in a privileged container. Without driver-opts it
      # would pull the floating moby/buildkit:buildx-stable-1 tag, so the image is pinned by digest (plan
      # §10.3): on 2026-09-23 buildx-stable-1 and v0.32.2 both resolved to this index digest (checked
      # with `docker buildx imagetools inspect`; linux/amd64 and linux/arm64 included). Dependabot does
      # not update driver-opts, so move it by hand, together with the python base-image digest in
      # interop/scripted-idp/Dockerfile. The buildx CLI is the runner image's own.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build image (load only, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: interop/scripted-idp
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.SCRIPTED_IDP_IMAGE }}
          # Nightly and manual builds ignore the cache so upstream pin rot surfaces; they still refresh it.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=scripted-idp-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=scripted-idp-${{ matrix.runner }}

      - name: Assert the image exists locally
        run: |
          docker image inspect --format 'id={{.Id}} os={{.Os}} arch={{.Architecture}} size={{.Size}}' \
            "$SCRIPTED_IDP_IMAGE"

      # The Dockerfile already runs the selftest at build time; this re-runs it from the built image with
      # no network, so it must pass with every input inside the image (plan §14.10). The image runs as
      # UID 65534, so the host output directory is world-writable.
      - name: Run selftest
        run: |
          out="${RUNNER_TEMP}/scripted-idp-selftest"
          mkdir -p "$out"
          chmod 0777 "$out"
          docker run --rm --network none --volume "${out}:/out" "$SCRIPTED_IDP_IMAGE" selftest --out /out

      - name: Upload selftest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripted-idp-selftest-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scripted-idp-selftest/results.json
            ${{ runner.temp }}/scripted-idp-selftest/versions.json
          if-no-files-found: warn
          retention-days: 30

  # Advisory, nightly. Other JDK builds of the supported line (plan §14.6). Failures do not fail the run.
  alt-jdk:
    name: Alternative JDK (${{ matrix.name }}, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Temurin 21, distribution: temurin, jdk: '21' }
          - { name: Semeru 21 OpenJ9, distribution: semeru, jdk: '21' }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ${{ matrix.name }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

  # Advisory, nightly. The latest early-access JDK from jdk.java.net (setup-java's `oracle-openjdk`
  # distribution accepts `N-ea`). Move to the next EA line after each GA, every March and September.
  ea:
    name: Early-Access JDK (${{ matrix.jdk }}, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['28-ea']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenJDK ${{ matrix.jdk }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: oracle-openjdk
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

  # Gating from M1 (plan §10.3). Maven and the compiler run on Corretto 17; javadoc runs from
  # ${env.REVETSEC_JAVADOC_HOME}, a Corretto 26 that .github/scripts/install-pinned-corretto-linux-x64.sh
  # downloads, checks against its pinned SHA-256 and version, and exports (as Soklet's CI does). The pom
  # enables every doclint group except html, and failOnWarnings makes each doclint warning an error. Keep
  # the javadoc JDK at 26 to match the pom's Java API offline links (src/main/javadoc/links/java-26); move
  # both together.
  javadoc:
    name: Javadoc (Corretto 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the checksum-pinned javadoc JDK (Corretto 26)
        run: >-
          bash .github/scripts/install-pinned-corretto-linux-x64.sh
          javadocJava "${RUNNER_TEMP}" "${GITHUB_ENV}"
          "${RUNNER_TEMP}/javadoc-java-distribution.txt"

      - name: Set up Corretto 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build Javadoc (doclint warnings are errors)
        run: mvn -B -ntp -Dmaven.javadoc.failOnWarnings=true -DskipTests verify

  examples:
    name: Examples (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '27']
    steps:
      - name: Check out current examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned core artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec
          ref: f047c5d1e5c25206e0d27e3f3d5bdc932055fc7b
          path: .example-inputs/core
          persist-credentials: false

      - name: Check out pinned Soklet adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revetsec/revetsec-soklet
          ref: 2c2e3eb91722d462e0970ae02e0fe448d47b0a86
          path: .example-inputs/adapter
          persist-credentials: false

      - name: Check out pinned Soklet framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soklet/soklet
          ref: 8e1c689b729eb4cc45ffec1a1aed9668d07ffb10
          path: .example-inputs/framework
          persist-credentials: false

      - name: Set up Corretto
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}

      - name: Build exact artifacts and verify both unpublished examples
        run: |
          python3 examples/build.py --work "$RUNNER_TEMP/revetsec-examples" \
            --maven "$(command -v mvn)" --java-home "$JAVA_HOME" \
            --core-source "$GITHUB_WORKSPACE/.example-inputs/core" \
            --adapter-source "$GITHUB_WORKSPACE/.example-inputs/adapter" \
            --framework-source "$GITHUB_WORKSPACE/.example-inputs/framework"

      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: examples-${{ matrix.java }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/revetsec-examples/*.json
            ${{ runner.temp }}/revetsec-examples/*.log
            ${{ runner.temp }}/revetsec-examples/examples/*/target/surefire-reports/
            ${{ runner.temp }}/revetsec-examples/examples/*/target/nullability-audit.json
          if-no-files-found: warn

  rsa-oidc-examples:
    name: RSA/OIDC examples (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '27']
    steps:
      - name: Check out current examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}

      - name: Compile and run current-core RSA/OIDC examples
        run: |
          python3 examples/rsa-oidc/build.py --work "$RUNNER_TEMP/revetsec-rsa-examples" \
            --maven "$(command -v mvn)" --java-home "$JAVA_HOME" \
            --core-source "$GITHUB_WORKSPACE"

      - name: Upload example evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsa-oidc-examples-${{ matrix.java }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/revetsec-rsa-examples/*.json
            ${{ runner.temp }}/revetsec-rsa-examples/*.log
            ${{ runner.temp }}/revetsec-rsa-examples/example/target/surefire-reports/
            ${{ runner.temp }}/revetsec-rsa-examples/example/target/nullability-audit.json
          if-no-files-found: warn

  # Gating from M3. KeycloakOAuthIT starts the digest-pinned Keycloak image, imports the test-only realm and
  # exercises OAuth confidential/public code flows, client credentials, refresh and revocation, plus OIDC
  # query/form-post login, JSON/signed UserInfo, session persistence/refresh and rejection boundaries. The pinned
  # provider's realm-key HMAC signature is rejected. Testcontainers owns teardown; this runner needs no Ryuk.
  integration:
    name: Integration (Keycloak, JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # ResourceProviderFixturesIT deliberately refuses test-time pulls. Prepare the
      # same digest used by both Keycloak fixtures before Failsafe can select either.
      - name: Pull the pinned Keycloak integration fixture
        run: docker pull quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c

      - name: Build the locked local node-oidc-provider fixture
        run: docker build --pull=false -t revetsec-interop/node-oidc-provider:local interop/node-oidc-provider

      - name: Build the locked local scripted-IdP fixture
        run: docker build --pull=false -t revetsec-scripted-idp:local interop/scripted-idp

      - name: Run the Keycloak, node-provider and scripted-IdP integration tests
        run: mvn -B -ntp -Pintegration -Dmaven.javadoc.skip=true verify

      - name: Require executed integration cases and zero skips
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          paths = glob.glob('target/failsafe-reports/TEST-*.xml')
          suites = [ET.parse(path).getroot() for path in paths]
          executed = sum(int(suite.attrib.get('tests', '0')) for suite in suites)
          skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in suites)
          required = {
              'confidentialAndPublicCodeFlowsRefreshAndRevocation',
              'serviceAccountGetsToken',
              'confidentialOidcQueryChecksUserInfoAndRefresh',
              'publicOidcFormPostChecksUserInfoAndRefresh',
              'confidentialPostOidcFormPostChecksUserInfoAndRefresh',
              'signedUserInfoChecksConfiguredAlgorithmAndSubject',
              'signedUserInfoPolicyRejectsRealJsonResponse',
              'hmacOidcRejectsProviderRealmKeySignature',
              'wrongOidcCallbackRouteRejectsBeforeTokenPost',
              'changedAuthorizationNonceRejectsProviderSignedIdToken',
          }
          names = {case.attrib.get('name') for suite in suites for case in suite.findall('testcase')}
          missing = required - names
          required_resource_cases = {'com.revetsec.oauth.NodeAccessTokenIT': {'clientCredentialsResourceIndicatorReturnsSuccessResult', 'revocationTurnsIntrospectionInactiveWithoutCaching', 'authorizationCodeResourceIndicatorReturnsStrictProof', 'unconfiguredResourceIndicatorFailsAtActualProvider', 'introspectionChecksAudienceAndPostsForEveryValidation', 'actualProviderKeyRotationRefreshesSameValidatorAndCache', 'structuredJwtIntrospectionIsProviderFailureRatherThanCredentialRejection', 'jwtWrongAudienceReturnsRejectedResultWithoutProof'}, 'com.revetsec.oauth.KeycloakAccessTokenIT': {'introspectionAudienceCheckSendsFreshPostEachTime', 'strictJwtWrongAudienceRejectsBeforeProofRelease', 'namedCompatibilityStillRejectsWrongAudienceBeforeProofRelease', 'enabledAccessTokenHeaderPassesStrictClientCredentials', 'revokedCodeFlowSessionReturnsInactiveOnEveryPost', 'enabledAccessTokenHeaderAndClientIdMapperPassStrictCodeFlow', 'disabledAccessTokenHeaderNeedsNamedCompatibilityAndExtraClaim'}}
          for classname, methods in required_resource_cases.items():
              actual = {case.attrib.get('name') for suite in suites for case in suite.findall('testcase') if case.attrib.get('classname') == classname}
              missing.update(classname + "#" + name for name in methods - actual)
          saml_class = 'com.revetsec.saml.ScriptedIdpSsoIT'
          saml_expected = {'libxmlsecVerdictsAndSpPolicyStaySeparateAcrossSignedPlacements',
                           'signedStructureCorpusHasIndependentSignatureProof',
                           'signedAttributeCorpusHasIndependentSignatureProof',
                           'signedIdentityShapeCorpusHasIndependentSignatureProof',
                           'signedBoundaryShapeCorpusHasIndependentSignatureProof',
                           'libxmlsecDecryptionMatchesRevetsecAcrossGcmAndCbcMatrix',
                           'libxmlsecSeparatesEncryptedEnvelopeMutationsFromCiphertext',
                           'encryptedPolicyNegativesStayRejected',
                           'independentRedirectLogoutRequestSignerSeparatesWireAndSemanticFailures',
                           'independentRedirectLogoutResponseSignerPreservesPendingUntilValidResult'}
          saml_actual = {case.attrib.get('name') for suite in suites for case in suite.findall('testcase') if case.attrib.get('classname') == saml_class}
          missing.update(saml_class + '#' + name for name in saml_expected - saml_actual)
          failed = sum(int(suite.attrib.get('failures', '0')) + int(suite.attrib.get('errors', '0')) for suite in suites)
          if executed < len(required) or skipped or failed or missing:
              sys.exit(f'Integration count is {executed}; skipped: {skipped}; failed: {failed}; missing: {sorted(missing)}')
          print(f'Integration cases executed: {executed}; skipped: {skipped}; all required OAuth/OIDC/resource cases present')
          PY

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  # Gating RC-2 slice. Direct OpenSAML 5.2.2 and Spring Security 7 whole-SP
  # comparators live in a test-only module, outside the published core graph.
  differential:
    name: Differential (SAML, JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Install the current core for the isolated comparator
        run: mvn -B -ntp -DskipTests -Dmaven.javadoc.skip=true install

      - name: Compare Revetsec with Spring Security and OpenSAML
        run: mvn -B -ntp -f differential/pom.xml verify

      - name: Require the SAML comparator cases and zero skips
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          suites = [ET.parse(path).getroot() for path in glob.glob('differential/target/surefire-reports/TEST-*.xml')]
          required = {
              'com.revetsec.differential.SpringSamlComparatorTests': {
                  'signedPlacementsAgreeOnIdentityAndSignedTampering',
                  'wrapperMutationsNeverReleaseAttackerIdentity',
                  'legacySha1NeedsExplicitRevetsecCompatibility',
                  'encryptedAssertionsAgreeOnIdentity',
                  'cbcRequiresRevetsecOptInAndSignedResponse',
                  'encryptedNegativesDoNotReleaseAttackerIdentity'},
              'com.revetsec.differential.OpenSamlSpComparatorTests': {
                  'signedPlacementsResolveOnlyTheTrustedIdentity',
                  'legacySha1NeedsExplicitRevetsecCompatibility',
                  'wrapperAndNamespaceMutationsNeverReleaseAnIdentity',
                  'encryptedAssertionsAndEncryptedIdResolveTrustedIdentity',
                  'encryptedNegativesAndUnsignedResponseDoNotAuthenticate',
                  'encryptedWrapperMatrixNeverReleasesAttackerIdentity',
                  'validlySignedAmbiguousResponsesShowIdentitySelectionDifferences',
                  'assertionSignedAmbiguitiesKeepParserVerdictsPinned',
                  'signedSchemaInstanceHintsKeepParserVerdictsPinned',
                  'signedIdentityShapeKeepsParserSelectionPinned',
                  'signedBearerAndConditionsShapeKeepsParserSelectionPinned'},
              'com.revetsec.differential.OpenSamlLogoutComparatorTests': {
                  'idpInitiatedLogoutRequestsAgreeOnSignedSemantics',
                  'spInitiatedLogoutResponsesAgreeOnSignedSemantics',
                  'equivalentRelayEncodingInvalidatesBothBindingSignatures'}}
          missing = set()
          for classname, expected in required.items():
              actual = {case.attrib.get('name') for suite in suites
                        for case in suite.findall('testcase')
                        if case.attrib.get('classname') == classname}
              missing.update(classname + '#' + name for name in expected - actual)
          skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in suites)
          failed = sum(int(suite.attrib.get('failures', '0')) + int(suite.attrib.get('errors', '0'))
                       for suite in suites)
          if not suites or missing or skipped or failed:
              sys.exit(f'SAML differential missing: {sorted(missing)}; '
                       f'skipped: {skipped}; failed: {failed}')
          print(f'SAML comparator methods required: {sum(map(len, required.values()))}; '
                f'skipped: {skipped}')
          PY

      - name: Upload SAML differential reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saml-differential-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: differential/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  # Gating. Four inherited OIDF plans plus the selected private-key comprehensive profile; self-run evidence only.
  conformance:
    name: OIDF RP (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Corretto 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
      - name: Verify evidence guard
        run: python3 -m unittest discover -s conformance -p 'test_*.py'
      - name: Run four local RP plans
        run: python3 conformance/run.py --pull-images --repository-tail "$HOME/.m2/repository" --output "$RUNNER_TEMP/oidf-evidence"
      - name: Upload OIDF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidf-rp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oidf-evidence
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # Later milestones (plan §10.3). Uncomment and complete each job when its milestone starts.
  # "[inferred]" marks a start the plan does not fix explicitly.
  # ---------------------------------------------------------------------------------------------------

  # From M5, add node-oidc-provider, at+jwt and introspection;
  # from M7/M8/M8b, add scripted-IdP SAML signing, encryption and SLO, with its IT floor.

  # mcp-client-auth: from M5 [inferred]. Advisory, nightly. MCP conformance `auth` client scenarios through
  # the Java shim in conformance/, with an expected-failures baseline (CIMD unsupported).

  # metadata-drift: from M3 [inferred; the metadata fixture suite is captured at M3 start]. Advisory,
  # nightly; opens an issue (needs `issues: write` at job level only). Structural diff of live
  # discovery/JWKS/SAML metadata against the latest fixture snapshot.

  # examples: from M5. Gating on PR. Install core (-DskipTests -Dmaven.javadoc.skip=true), check out
  # revetsec/revetsec-soklet at the SHA in examples/revetsec-soklet.sha and install it against this
  # core, then `mvn -B -ntp -f examples/pom.xml verify`. Soklet is built at a pinned SHA until 4.0.0 is
  # on Central.

  # interop: from M6. Advisory; nightly + dispatch, never on fork PRs. Machine-to-machine live probes
  # (Entra, Okta, Auth0, GitHub, GitHub Actions OIDC). Secrets only in the `interop` environment
  # (main-only deployment rule) and the reviewer-gated `interop-manual` environment for dispatch. The
  # Actions OIDC leg sets `permissions: id-token: write` at job level only.

  # interop-selfhosted: from M6 [inferred] for Hydra and Dex; SimpleSAMLphp 2.5 and mock-saml from M7;
  # authentik (outbound SCIM client) from M11. Advisory, nightly; Hydra, Dex and authentik become gating
  # after 30 consecutive green nightly runs. Shibboleth IdP 5 is a workflow_dispatch capture at M8 and RC-2.

  # scim: from M11. Gating on PR. scim2-tester (hash-pinned) against the examples/ server.

  # differential additions: RC-1 JOSE/JSON and RC-3 SCIM remain open. RC-2 still needs
  # the remaining SLO, XSW, Fragile-Lock and structure-aware comparison matrix.
