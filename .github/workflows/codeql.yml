name: CodeQL

# Actions are pinned to full commit SHAs; the trailing comment is the tag each was resolved from.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly sweep so analysis stays current without pushes; offset from the nightly CI cron.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      security-events: write # upload the analysis to code scanning
      actions: read # let CodeQL read this workflow run's metadata
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Corretto 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # A manual build (not autobuild) so CodeQL analyzes exactly what Maven compiles for the published JAR.
      # The tooling subprojects (fuzz/, verification/, later conformance/, differential/, examples/) are not
      # compiled here: they are never published.
      - name: Compile
        run: mvn -B -ntp -DskipTests -Dmaven.javadoc.skip=true clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
