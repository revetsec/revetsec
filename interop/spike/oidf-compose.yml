# OpenID Foundation conformance suite release-v5.3.1, for the Tier-1 spike.
#
# Differences from upstream:
#   - every image is pinned by multi-arch index digest (linux/amd64 + linux/arm64);
#   - MongoDB keeps its data in the image's anonymous volume, not ./mongo/data,
#     so `docker compose down -v` leaves nothing behind;
#   - ports bind to 127.0.0.1 only.
# The Google/GitLab OIDC login settings keep upstream's dummy placeholder
# values: the dev profile needs no login, but the server fails to start
# (Spring OAuth2 client configuration) when they are absent.
#
# The public port must equal nginx's container port (8443/8444) because the
# suite calls its own BASE_URL through the in-network alias below. Run with
# `docker compose -p <unique-project> -f oidf-compose.yml up -d`.

services:
  mongodb:
    # mongo:6.0.13
    image: mongo:6.0.13@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
  nginx:
    # registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.1
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.1@sha256:6ea3f4b8854f1f3626c81350900962d9e5f86424791d8e72b378a26ee2f4c105
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    depends_on:
      - server
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
  server:
    # registry.gitlab.com/openid/conformance-suite:release-v5.3.1
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.1@sha256:69495f453a920c262f66e5e72abd12501c33e05ce88051cddf300c00621a4d70
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      - mongodb
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
